version: '3.8'

services:
  # PostgreSQL Database
  database:
    image: postgres:15
    container_name: matematika_db
    environment:
      POSTGRES_DB: matematika_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - matematika_network
    restart: unless-stopped

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: matematika_backend
    environment:
      - DATABASE_URL=postgresql://admin:password123@database:5432/matematika_db
      - SMTP_SERVER=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - NOTIFICATION_EMAIL=lazar.davidovic98@gmail.com
      - DEBUG=False
    ports:
      - "8000:8000"
    depends_on:
      - database
    networks:
      - matematika_network
    volumes:
      - ./backend/uploads:/app/uploads
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: matematika_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - matematika_network
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: matematika_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl  # Za SSL sertifikate
    depends_on:
      - frontend
      - backend
    networks:
      - matematika_network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  matematika_network:
    driver: bridge

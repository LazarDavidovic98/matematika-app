# 🐳 DOCKER COMPOSE - ORKESTRATOR ZA MULTI-KONTEJNER APLIKACIJE
# ==============================================================
# Docker Compose omogućava pokretanje kompletne aplikacije sa jednom komandom
# Definiše kako se različiti servisi (baza, backend, frontend) povezuju

services:
  # 🗄️ POSTGRESQL DATABASE SERVIS
  database:
    image: postgres:15                    # Koristi gotovu PostgreSQL 15 sliku sa Docker Hub-a
    container_name: matematika_db         # Ime kontejnera (za lakše upravljanje)
    
    # 🌍 ENVIRONMENT VARIJABLE za PostgreSQL konfiguraciju
    environment:
      POSTGRES_DB: matematika_db          # Ime baze podataka
      POSTGRES_USER: admin                # Database korisnik  
      POSTGRES_PASSWORD: password123      # Password (u produkciji koristiti Docker secrets!)
      POSTGRES_HOST_AUTH_METHOD: trust    # Autentifikacija (trust za development)
    
    # 💾 VOLUMES - trajno čuvanje podataka
    volumes:
      - postgres_data:/var/lib/postgresql/data           # Named volume za DB podatke
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql  # SQL script za inicijalizaciju
    
    # 🌐 PORT MAPPING - mapiranje porta van kontejnera
    ports:
      - "5432:5432"                      # host_port:container_port
    
    # 🔗 DOCKER NETWORKS - omogućava komunikaciju između kontejnera
    networks:
      - matematika_network
    
    # 🔄 RESTART POLICY - automatski restart kontejnera
    restart: unless-stopped               # Restart osim ako je manual stopped

  # 🔧 FASTAPI BACKEND SERVIS  
  backend:
    # 🏗️ BUILD KONFIGURACIJA - gradi sliku iz našeg koda
    build:
      context: ./backend                  # Folder sa kodom
      dockerfile: Dockerfile              # Build instrukcije
    container_name: matematika_backend    # Ime kontejnera
    environment:
      - DATABASE_URL=postgresql://admin:password123@database:5432/matematika_db
      - SMTP_SERVER=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - NOTIFICATION_EMAIL=lazar.davidovic98@gmail.com
      - DEBUG=False
    ports:
      - "8000:8000"
    depends_on:
      - database
    networks:
      - matematika_network
    volumes:
      - ./backend/uploads:/app/uploads
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: matematika_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - matematika_network
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: matematika_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl  # Za SSL sertifikate
    depends_on:
      - frontend
      - backend
    networks:
      - matematika_network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  matematika_network:
    driver: bridge
